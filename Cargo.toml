[workspace]
members = ["crates/fontpixel", "crates/fontpixel-cli", "crates/fontpixel-py", "crates/fontpixel-wasm"]
default-members = ["crates/fontpixel", "crates/fontpixel-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
authors = ["Tom Chen"]

[workspace.dependencies]
fontpixel = { path = "crates/fontpixel", version = "0.1.0", default-features = false }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
