[package]
name = "fontpixel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"
[package.metadata]
cargo-fuzz = true
[dependencies]
libfuzzer-sys = "0.4"
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
fontpixel = { version = "0.1.0", path = "../crates/fontpixel", default-features = false, features = [] }
[workspace]
members = ["."]
[[bin]]
name = "bdf"
path = "fuzz_targets/bdf.rs"
test = false
doc = false
bench = false
[[bin]]
name = "pcf"
path = "fuzz_targets/pcf.rs"
test = false
doc = false
bench = false

