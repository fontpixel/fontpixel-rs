kbits-only = ["fontpixel/kbits"]
pk-only = ["fontpixel/pk"]
gf-only = ["fontpixel/gf"]
plan9-only = ["fontpixel/plan9"]
amiga-only = ["fontpixel/amiga"]
gem-only = ["fontpixel/gem"]
snf-only = ["fontpixel/snf"]
kbitx-only = ["fontpixel/kbitx"]
pbf-only = ["fontpixel/pbf"]
hbf-only = ["fontpixel/hbf"]
default = ["baseline", "phase4"]
baseline = ["fontpixel/bdf", "fontpixel/pcf", "fontpixel/yaff", "fontpixel/sfnt", "fontpixel/cff", "fontpixel/compat-bdfparser", "fontpixel/otb", "fontpixel/bdat", "fontpixel/color", "fontpixel/woff", "fontpixel/woff2", "fontpixel/ttc", "fontpixel/ttf", "fontpixel/otf", "fontpixel/vector-raster", "fontpixel/svg", "fontpixel/hex", "fontpixel/psf", "fontpixel/fnt", "fontpixel/fon", "fontpixel/image", "fontpixel/c", "fontpixel/kbitx", "fontpixel/pbf", "fontpixel/hbf"]
image-c = ["fontpixel/image", "fontpixel/c"]
phase4 = ["fontpixel/draw", "fontpixel/raw", "fontpixel/cpi", "fontpixel/pf2", "fontpixel/fontx2", "fontpixel/hzk", "fontpixel/nfnt", "fontpixel/bmfont", "fontpixel/sfd", "fontpixel/kbits", "fontpixel/pk", "fontpixel/gf", "fontpixel/plan9", "fontpixel/amiga", "fontpixel/gem", "fontpixel/snf"]

