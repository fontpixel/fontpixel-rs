[package]
name = "fontpixel"
description = "Bitmap font conversion library (under development)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["bdf", "pcf", "yaff"]
compat-bdfparser = ["bdf", "pcf", "sfnt", "dep:serde_json"]
all-formats = ["bdf", "pcf", "snf", "hex", "draw", "psf", "cpi", "raw", "yaff", "pf2", "fnt", "fon", "fontx2", "hzk", "hbf", "hanfont", "nfnt", "bdat", "iigs", "otb", "ttf", "otf", "woff", "woff2", "ttc", "color", "vector-raster", "svg", "bmfont", "image", "c", "kbitx", "kbits", "pbf", "sfd", "pk", "gf", "plan9", "amiga", "gem", "vfont", "fzx", "figlet", "palm", "gdr", "drcs", "bbc", "beos", "catalyst", "chiwriter", "comfont", "consoleet", "daisy", "dashen", "dosstart", "drhalo", "edwin", "fbit", "geos", "gpi", "grasp", "hppcl", "hrcg", "lisa", "mgtk", "mkwinfont", "oberon", "pcgeos", "pcr", "pilfont", "plus3dos", "psf2txt", "polyprint", "prebuilt", "printshop", "pxl", "riscos", "sfont", "signum", "symbos", "tasprint", "vtfont", "writeon", "wsfont", "wyse", "xbin", "xerox", "zapfont", "rockbox", "u8m", "cybiko", "playdate", "hmzk", "sbf", "qpf", "qpf2", "ssfn", "vlw", "pfr"]
bdf = ["gzip"]
pcf = ["gzip"]
snf = []
hex = []
draw = []
psf = ["gzip"]
cpi = []
raw = []
yaff = ["gzip", "dep:serde", "dep:serde_json"]
pf2 = []
fnt = []
fon = ["fnt"]
fontx2 = []
hzk = []
hbf = []
hanfont = []
nfnt = []
bdat = ["sfnt"]
iigs = []
otb = ["sfnt"]
ttf = ["vector-raster"]
otf = ["vector-raster"]
woff = ["vector-raster", "dep:flate2"]
woff2 = ["vector-raster", "dep:brotli"]
ttc = ["vector-raster"]
color = ["sfnt", "dep:png"]
vector-raster = ["cff"]
svg = ["dep:roxmltree", "dep:svgtypes", "dep:xmlparser"]
bmfont = ["dep:png", "dep:xmlparser", "dep:serde_json", "dep:serde"]
image = ["dep:image-codec", "dep:serde", "dep:serde_json", "dep:toml"]
png = ["dep:flate2", "dep:crc32fast"]
c = ["dep:serde", "dep:serde_json"]
kbitx = ["dep:roxmltree", "dep:xmlparser"]
kbits = []
pbf = []
sfd = []
pk = []
gf = []
plan9 = []
amiga = []
gem = []
vfont = []
fzx = []
figlet = []
palm = []
gdr = []
drcs = []
bbc = []
beos = []
catalyst = []
chiwriter = []
comfont = []
consoleet = []
daisy = []
dashen = ["hppcl"]
dosstart = []
drhalo = []
edwin = []
fbit = ["nfnt"]
geos = []
gpi = []
grasp = []
hppcl = []
hrcg = []
lisa = ["nfnt"]
mgtk = []
mkwinfont = []
oberon = []
pcgeos = []
pcr = []
pilfont = ["dep:image-codec"]
plus3dos = []
psf2txt = []
polyprint = []
prebuilt = []
printshop = []
pxl = []
riscos = []
sfont = ["dep:image-codec"]
signum = []
symbos = []
tasprint = []
vtfont = []
writeon = []
wsfont = ["dep:image-codec"]
wyse = []
xbin = []
xerox = []
zapfont = []
rockbox = []
u8m = []
cybiko = []
playdate = ["dep:png", "dep:flate2", "dep:serde_json"]
hmzk = []
sbf = []
qpf = []
qpf2 = ["sfnt"]
ssfn = ["gzip"]
vlw = []
pfr = []
cjk-charsets = []
cff = ["sfnt"]
fea = []
gzip = ["dep:flate2"]
serde = ["dep:serde"]

sfnt = ["dep:read-fonts"]

[dependencies]
image-codec = { package = "image", version = "0.25.8", default-features = false, features = ["png", "bmp", "gif", "tga", "pnm"], optional = true }
toml = { version = "1.1.2", default-features = false, features = ["parse", "display", "serde"], optional = true }
xmlparser = { version = "0.13.6", optional = true }
roxmltree = { version = "0.21.1", optional = true }
svgtypes = { version = "0.16.1", optional = true }
png = { version = "0.18.1", optional = true }
read-fonts = { version = "0.44.0", optional = true }
serde_json = { workspace = true, optional = true, features = ["arbitrary_precision", "preserve_order"] }
crc32fast = { version = "1.5", optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
serde = { workspace = true, optional = true }
brotli = { version = "9.0.0", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
same-file = "1.0.6"
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "bitmap"
harness = false

[[bench]]
name = "bdf"
harness = false
required-features = ["bdf"]

[[bench]]
name = "pcf"
harness = false
required-features = ["bdf", "pcf"]

[[bench]]
name = "render"
harness = false

[[example]]
name = "sfnt_check"
required-features = ["compat-bdfparser"]

[[example]]
name = "tong_export"
required-features = ["bdf", "pcf", "otb", "ttf", "otf", "woff2"]
