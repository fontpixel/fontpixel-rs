[package]
name = "fontpixel"
description = "Bitmap font conversion library (under development)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["bdf", "pcf", "yaff"]
compat-bdfparser = ["bdf", "pcf", "sfnt", "dep:serde_json"]
all-formats = ["bdf", "pcf", "snf", "hex", "draw", "psf", "cpi", "raw", "yaff", "pf2", "fnt", "fon", "fontx2", "hzk", "hbf", "hanfont", "nfnt", "bdat", "iigs", "otb", "ttf", "otf", "woff", "woff2", "ttc", "color", "vector-raster", "svg", "bmfont", "image", "c", "kbitx", "kbits", "pbf", "sfd", "pk", "gf", "plan9", "amiga", "gem", "vfont", "fzx", "figlet", "palm", "gdr", "drcs"]
bdf = ["gzip"]
pcf = ["gzip"]
snf = []
hex = []
draw = []
psf = []
cpi = []
raw = []
yaff = ["gzip", "dep:serde", "dep:serde_json"]
pf2 = []
fnt = []
fon = []
fontx2 = []
hzk = []
hbf = []
hanfont = []
nfnt = []
bdat = ["sfnt"]
iigs = []
otb = ["sfnt"]
ttf = ["vector-raster"]
otf = ["vector-raster"]
woff = ["vector-raster", "dep:flate2"]
woff2 = ["vector-raster", "dep:brotli"]
ttc = ["vector-raster"]
color = ["sfnt", "dep:png"]
vector-raster = ["cff"]
svg = ["dep:roxmltree", "dep:svgtypes"]
bmfont = []
image = []
png = ["dep:flate2", "dep:crc32fast"]
c = []
kbitx = []
kbits = []
pbf = []
sfd = []
pk = []
gf = []
plan9 = []
amiga = []
gem = []
vfont = []
fzx = []
figlet = []
palm = []
gdr = []
drcs = []
cjk-charsets = []
cff = ["sfnt"]
fea = []
gzip = ["dep:flate2"]
serde = ["dep:serde"]

sfnt = ["dep:read-fonts"]

[dependencies]
roxmltree = { version = "0.21.1", optional = true }
svgtypes = { version = "0.16.1", optional = true }
png = { version = "0.18.1", optional = true }
read-fonts = { version = "0.44.0", optional = true }
serde_json = { workspace = true, optional = true, features = ["arbitrary_precision", "preserve_order"] }
crc32fast = { version = "1.5", optional = true }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true }
serde = { workspace = true, optional = true }
brotli = { version = "9.0.0", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "bitmap"
harness = false

[[bench]]
name = "bdf"
harness = false
required-features = ["bdf"]

[[bench]]
name = "pcf"
harness = false
required-features = ["bdf", "pcf"]

[[bench]]
name = "render"
harness = false

[[example]]
name = "sfnt_check"
required-features = ["compat-bdfparser"]

[[example]]
name = "glyf_check"
required-features = ["sfnt"]

[[example]]
name = "cff_check"
required-features = ["cff"]

[[example]]
name = "bitmap_check"
required-features = ["bdf", "otb", "bdat", "color"]

[[example]]
name = "woff_check"
required-features = ["woff", "woff2"]

[[example]]
name = "raster_check"
required-features = ["ttc", "woff", "woff2"]
