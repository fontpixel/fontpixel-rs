[package]
name = "fontpixel"
description = "Bitmap font conversion library (under development)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = ["bdf", "pcf", "yaff"]
all-formats = ["bdf", "pcf", "snf", "hex", "draw", "psf", "cpi", "raw", "yaff", "pf2", "fnt", "fon", "fontx2", "hzk", "hbf", "hanfont", "nfnt", "bdat", "iigs", "otb", "ttf", "otf", "woff", "woff2", "ttc", "color", "vector-raster", "svg", "bmfont", "image", "c", "kbitx", "kbits", "pbf", "sfd", "pk", "gf", "plan9", "amiga", "gem", "vfont", "fzx", "figlet", "palm", "gdr", "drcs"]
bdf = []
pcf = []
snf = []
hex = []
draw = []
psf = []
cpi = []
raw = []
yaff = []
pf2 = []
fnt = []
fon = []
fontx2 = []
hzk = []
hbf = []
hanfont = []
nfnt = []
bdat = []
iigs = []
otb = []
ttf = []
otf = []
woff = []
woff2 = []
ttc = []
color = []
vector-raster = []
svg = []
bmfont = []
image = []
c = []
kbitx = []
kbits = []
pbf = []
sfd = []
pk = []
gf = []
plan9 = []
amiga = []
gem = []
vfont = []
fzx = []
figlet = []
palm = []
gdr = []
drcs = []
cjk-charsets = []
cff = []
fea = []
gzip = []
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "bitmap"
harness = false
