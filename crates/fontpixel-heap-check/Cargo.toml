[package]
name = "fontpixel-heap-check"
description = "Counting-allocator measurements for fontpixel codec heap bounds (test-only)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

# Not in workspace default-members; run explicitly:
#   cargo test --locked --release -p fontpixel-heap-check -- --nocapture
# A process-wide `#[global_allocator]` needs `unsafe impl GlobalAlloc`, which
# the workspace lint table forbids. This package therefore keeps its own lint
# table and contains nothing but the counting allocator and its measurements.

[dependencies]
fontpixel = { workspace = true, features = ["woff", "woff2", "ttc"] }
brotli = { version = "=9.0.0", default-features = false, features = ["std"] }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
