[package]
name = "fontpixel-cli"
description = "fontpixel command-line tool: inspect, convert, merge, subset, preview and render bitmap fonts in 99 formats"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://github.com/fontpixel/fontpixel-rs/blob/main/crates/fontpixel-cli/README.md"
readme = "README.md"
keywords = ["font", "bitmap-font", "bdf", "converter", "cli"]
categories = ["command-line-utilities", "graphics", "encoding"]
include = ["/src/**", "/README.md", "/LICENSE"]

[[bin]]
name = "fontpixel"
path = "src/main.rs"
doc = false

[[bin]]
name = "fontpixel-parity"
path = "src/parity.rs"
doc = false
required-features = ["parity"]

[features]
parity = ["fontpixel/compat-bdfparser", "fontpixel/cjk-charsets", "dep:base64"]
default = ["bdf", "yaff", "fontpixel/default", "pcf", "otb", "bdat", "png", "opentype", "svg", "hex", "psf", "fnt", "fon", "image", "c", "kbitx", "pbf", "hbf", "draw", "raw", "cpi", "pf2", "fontx2", "hzk", "nfnt", "bmfont", "sfd", "kbits", "pk", "gf", "plan9", "amiga", "gem", "snf", "hanfont", "iigs", "vfont", "fzx", "figlet", "palm", "gdr", "drcs", "color", "bbc", "beos", "catalyst", "chiwriter", "comfont", "consoleet", "daisy", "dashen", "dosstart", "drhalo", "edwin", "fbit", "geos", "gpi", "grasp", "hppcl", "hrcg", "lisa", "mgtk", "mkwinfont", "oberon", "pcgeos", "pcr", "pilfont", "plus3dos", "psf2txt", "polyprint", "prebuilt", "printshop", "pxl", "riscos", "sfont", "signum", "symbos", "tasprint", "vtfont", "writeon", "wsfont", "wyse", "xbin", "xerox", "zapfont", "rockbox", "u8m", "cybiko", "playdate", "hmzk", "sbf", "qpf", "qpf2", "ssfn", "vlw", "pfr"]
bdf = ["fontpixel-ops/bdf"]
yaff = ["fontpixel-ops/yaff"]
