base64 = { version = "0.22", optional = true }
fontpixel = { workspace = true, features = ["serde"] }
fontpixel-ops = { path = "../fontpixel-ops", version = "0.1.0", default-features = false, features = ["fs", "clap", "toml"] }
clap.workspace = true
serde.workspace = true
serde_json = { workspace = true }

