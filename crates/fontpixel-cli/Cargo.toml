[package]
name = "fontpixel-cli"
description = "Command-line interface for fontpixel (under development)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "fontpixel"
path = "src/main.rs"
doc = false

[[bin]]
name = "fontpixel-parity"
path = "src/parity.rs"
doc = false
required-features = ["parity"]

[features]
parity = ["fontpixel/compat-bdfparser", "fontpixel/cjk-charsets", "dep:sha2", "dep:base64"]
default = ["fontpixel/default", "pcf", "png", "opentype", "svg", "hex", "psf", "fnt", "fon", "image", "c", "kbitx", "pbf", "hbf"]
pcf = ["fontpixel/pcf"]
hex = ["fontpixel/hex"]
psf = ["fontpixel/psf"]
fnt = ["fontpixel/fnt"]
fon = ["fnt", "fontpixel/fon"]
c = ["fontpixel/c"]
kbitx = ["fontpixel/kbitx"]
pbf = ["fontpixel/pbf"]
hbf = ["fontpixel/hbf"]
image = ["fontpixel/image"]
png = ["fontpixel/png"]
svg = ["fontpixel/svg"]
all-formats = ["fontpixel/all-formats", "pcf", "opentype", "svg", "hex", "psf", "fnt", "fon", "image", "c", "kbitx", "pbf", "hbf"]
opentype = ["fontpixel/ttf", "fontpixel/otf", "fontpixel/ttc", "fontpixel/cff", "fontpixel/woff", "fontpixel/woff2"]

[dependencies]
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
fontpixel = { workspace = true, features = ["serde"] }
clap.workspace = true
serde_json.workspace = true
cap-std = "4"
same-file = "1"

[lints]
workspace = true
