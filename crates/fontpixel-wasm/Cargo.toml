[package]
name = "fontpixel-wasm"
description = "WASM/JS bindings for fontpixel (npm package `fontpixel`): the complete native API plus a bdfparser-js-compatible layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "fontpixel_wasm"
crate-type = ["cdylib", "rlib"]

# Build profiles (scripts/build_wasm.sh): `full` is the default; `minimal`
# and `merge` select feature subsets for size measurements and the W8.3 merge
# page. `serde` (plain data) is always on.
[features]
default = ["full"]
full = ["all-formats", "compat-bdfparser", "cjk-charsets", "toml", "png"]
all-formats = ["fontpixel/all-formats", "fontpixel-ops/all-formats"]
compat-bdfparser = ["fontpixel/compat-bdfparser"]
cjk-charsets = ["fontpixel/cjk-charsets"]
# PNG image export (`toPng`, ops `render` to PNG); the encoder is pure Rust
# (flate2 + crc32fast) and is enabled in every profile.
png = ["fontpixel/png", "fontpixel-ops/png"]
# Batch job files in TOML text (never paths) through the shared CLI definition.
toml = ["fontpixel-ops/toml", "dep:clap"]
# Smallest useful build: BDF/PCF/YAFF only.
minimal = ["fontpixel/bdf", "fontpixel/pcf", "fontpixel/yaff", "fontpixel-ops/bdf", "fontpixel-ops/pcf", "fontpixel-ops/yaff", "png"]
# W8.3 merge page: bitmap inputs and every merge output (BDF, PCF, OTB,
# TTF/OTF/WOFF/WOFF2) plus the CJK selection tables.
merge = ["fontpixel/bdf", "fontpixel/pcf", "fontpixel/otb", "fontpixel/ttf", "fontpixel/otf", "fontpixel/woff", "fontpixel/woff2", "cjk-charsets", "fontpixel-ops/bdf", "fontpixel-ops/pcf", "fontpixel-ops/otb", "fontpixel-ops/opentype", "png"]

# bdfparser-js compatibility only (`fontpixel/bdfparser` in the npm package;
# the module behind bdfparser 4.x in browsers): BDF, PCF and the bdfparser
# TrueType writer/reader through `compat-bdfparser`, the exact CJK charset
# tables bdfparser's charset API needs, and PNG export. No other codecs, no
# TOML batch text.
bdfparser = ["compat-bdfparser", "cjk-charsets", "png"]

# Catalogue download table: BDF to PCF, bitmap TTF (OTB), vector TTF and WOFF2.
# YAFF is the intermediate the site uses to resolve legacy code pages. No CJK
# charset tables (about 1 MB gzipped): catalogue BDFs are ISO 10646 or
# ISO 8859-1. Without the tables the OpenType writer leaves the OS/2 CJK
# code-page bits clear, so only fonts too small to cover a whole CJK page
# (cp932, the smallest, has about 7,500 characters) match `web` byte for byte;
# the site sends larger fonts, and anything this profile cannot read, to `web`.
convert = ["fontpixel/bdf", "fontpixel/pcf", "fontpixel/yaff", "fontpixel/otb", "fontpixel/ttf", "fontpixel/woff2", "fontpixel-ops/bdf", "fontpixel-ops/pcf", "fontpixel-ops/yaff", "fontpixel-ops/otb", "fontpixel-ops/opentype", "png"]

# Catalogue tool: common bitmap/vector formats and exact CJK code-page coverage.
# No bdfparser compatibility, TOML or uncommon codecs.
web = ["fontpixel/bdf", "fontpixel/pcf", "fontpixel/yaff", "fontpixel/otb", "fontpixel/ttf", "fontpixel/otf", "fontpixel/woff", "fontpixel/woff2", "fontpixel/psf", "fontpixel/fnt", "fontpixel/fon", "fontpixel/hex", "fontpixel/bmfont", "fontpixel/c", "fontpixel-ops/bdf", "fontpixel-ops/pcf", "fontpixel-ops/yaff", "fontpixel-ops/otb", "fontpixel-ops/opentype", "fontpixel-ops/psf", "fontpixel-ops/fnt", "fontpixel-ops/fon", "fontpixel-ops/hex", "fontpixel-ops/bmfont", "fontpixel-ops/c", "cjk-charsets", "png"]

[dependencies]
fontpixel = { workspace = true, features = ["serde"] }
# `fs` (filesystem storage) is never enabled here: the WASM API has no paths.
fontpixel-ops = { path = "../fontpixel-ops", version = "0.1.0", default-features = false, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["arbitrary_precision", "preserve_order"] }
# Pinned exactly: the generated JS glue comes from the wasm-bindgen CLI of the
# same version (wasm-pack installs the CLI matching Cargo.lock).
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
# The command-line parser (`ops.parseArgs`), with the `toml` feature only.
clap = { workspace = true, optional = true }

# wasm-bindgen's generated glue contains `unsafe`, so this crate cannot use
# the workspace-wide `forbid(unsafe_code)`; it writes no unsafe code itself
# (`#![deny(unsafe_code)]` in lib.rs checks the hand-written code).
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

# Reproducible size numbers: wasm-pack runs this exact wasm-opt pass list on
# release builds (scripts/build_wasm.sh records the wasm-opt version and the
# sizes before and after it).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals"]
