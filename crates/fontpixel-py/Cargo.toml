[package]
name = "fontpixel-py"
description = "Python bindings for fontpixel: the complete native API plus a bdfparser-compatible layer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "fontpixel_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
fontpixel = { workspace = true, features = ["all-formats", "serde", "compat-bdfparser", "cjk-charsets"] }
fontpixel-ops = { path = "../fontpixel-ops", version = "0.1.0", features = ["serde", "toml"] }
# multiple-pymethods lets each area module add methods to the shared handle
# classes in its own file.
pyo3 = { version = "0.29", features = ["abi3-py310", "multiple-pymethods"] }
pythonize = "0.29"
# Only for `fontpixel.ops.parse_args`, which parses with the shared CLI definition.
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# pyo3's generated code contains `unsafe`, so this crate cannot use the
# workspace-wide `forbid(unsafe_code)`; it still writes no unsafe code itself.
[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
