[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "fontpixel"
description = "Bitmap font toolkit on a Rust core: read, edit, render and write 99 font formats, plus a bdfparser-compatible API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/**/*.txt"]
authors = [{ name = "Tom Chen" }]
keywords = ["font", "bitmap-font", "pixel-font", "bdf", "pcf", "opentype", "woff2", "bdfparser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Text Processing :: Fonts",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/fontpixel/fontpixel-rs"
Repository = "https://github.com/fontpixel/fontpixel-rs"
Documentation = "https://github.com/fontpixel/fontpixel-rs/blob/main/docs/python-api.md"
Changelog = "https://github.com/fontpixel/fontpixel-rs/blob/main/CHANGELOG.md"
Issues = "https://github.com/fontpixel/fontpixel-rs/issues"

[tool.maturin]
python-source = "python"
module-name = "fontpixel._native"
# Only maturin enables pyo3/extension-module, so `cargo test --workspace
# --all-features` still links the crate against libpython.
features = ["pyo3/extension-module"]
# Never package bytecode that `maturin develop` or test runs leave behind.
exclude = ["**/__pycache__/**", "**/*.pyc"]
