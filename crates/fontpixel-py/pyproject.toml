[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "fontpixel"
description = "Bitmap font toolkit: complete native API plus a bdfparser-compatible layer"
requires-python = ">=3.10"
license = { text = "MIT" }
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "fontpixel._native"
# Only maturin enables pyo3/extension-module, so `cargo test --workspace
# --all-features` still links the crate against libpython.
features = ["pyo3/extension-module"]
