[package]
name = "fontpixel-ops"
description = "The fontpixel command-line operations (convert, merge, render, subset, batch, ...) as a typed Rust API with memory or sandboxed filesystem storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/fontpixel-ops"
readme = "README.md"
keywords = ["font", "bitmap-font", "bdf", "conversion", "opentype"]
categories = ["graphics", "encoding"]
include = ["/src/**", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "fontpixel_ops"

[features]
fs = ["dep:cap-std", "dep:same-file", "dep:sha2"]
clap = ["dep:clap"]
toml = ["dep:toml", "clap"]
serde = ["fontpixel/serde"]
default = ["fs", "bdf", "yaff", "fontpixel/default", "pcf", "otb", "bdat", "png", "opentype", "svg", "hex", "psf", "fnt", "fon", "image", "c", "kbitx", "pbf", "hbf", "draw", "raw", "cpi", "pf2", "fontx2", "hzk", "nfnt", "bmfont", "sfd", "kbits", "pk", "gf", "plan9", "amiga", "gem", "snf", "hanfont", "iigs", "vfont", "fzx", "figlet", "palm", "gdr", "drcs", "color", "bbc", "beos", "catalyst", "chiwriter", "comfont", "consoleet", "daisy", "dashen", "dosstart", "drhalo", "edwin", "fbit", "geos", "gpi", "grasp", "hppcl", "hrcg", "lisa", "mgtk", "mkwinfont", "oberon", "pcgeos", "pcr", "pilfont", "plus3dos", "psf2txt", "polyprint", "prebuilt", "printshop", "pxl", "riscos", "sfont", "signum", "symbos", "tasprint", "vtfont", "writeon", "wsfont", "wyse", "xbin", "xerox", "zapfont", "rockbox", "u8m", "cybiko", "playdate", "hmzk", "sbf", "qpf", "qpf2", "ssfn", "vlw", "pfr"]
