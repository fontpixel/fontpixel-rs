opentype = ["fontpixel/ttf", "fontpixel/otf", "fontpixel/ttc", "fontpixel/cff", "fontpixel/woff", "fontpixel/woff2"]

[dependencies]
fontpixel = { workspace = true, features = ["serde"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
clap = { workspace = true, optional = true }
toml = { version = "=1.1.6", optional = true }
sha2 = { version = "0.10", optional = true }
cap-std = { version = "4", optional = true }
same-file = { version = "1", optional = true }

[lints]
workspace = true
