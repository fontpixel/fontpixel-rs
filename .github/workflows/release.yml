# Release: crates.io (fontpixel, fontpixel-ops, fontpixel-cli), PyPI
# (fontpixel wheels + sdist) and npm (fontpixel), in that order, after every
# test has passed. See RELEASING.md for the settings this needs.
#
# - Push of a tag `v<version>` (the workspace version): build, test, publish
#   to crates.io, PyPI and npm.
# - Manual run (workflow_dispatch): `dry_run` (default true) does everything
#   except uploading (`cargo publish --dry-run`, `twine check`, `npm publish
#   --dry-run`); `pypi` picks PyPI or TestPyPI. A real (non-dry) manual run
#   from a branch may only target TestPyPI; crates.io and npm uploads happen
#   only for tags.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test everything but upload nothing
        type: boolean
        default: true
      pypi:
        description: Python package index
        type: choice
        options: [testpypi, pypi]
        default: testpypi
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  PYTHONDONTWRITEBYTECODE: "1"
  RUST_TOOLCHAIN: 1.99.0
  WASM_PACK_VERSION: 0.15.0
  BINARYEN_VERSION: "117"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      dry_run: ${{ steps.plan.outputs.dry_run }}
      pypi: ${{ steps.plan.outputs.pypi }}
      registries: ${{ steps.plan.outputs.registries }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: plan
        name: Decide what this run publishes and check the versions
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PYPI: ${{ inputs.pypi }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          npm_version="$(node -p 'require("./crates/fontpixel-wasm/js/package.json").version')"
          [ "$npm_version" = "$version" ] || { echo "package.json version $npm_version != Cargo.toml $version"; exit 1; }
          if [ "$EVENT" = push ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "tag $REF_NAME does not match version $version"; exit 1; }
            dry_run=false; pypi=pypi; registries=true
          else
            dry_run="$INPUT_DRY_RUN"; pypi="$INPUT_PYPI"; registries=false
            if [ "$REF_TYPE" = tag ]; then
              [ "$REF_NAME" = "v$version" ] || { echo "tag $REF_NAME does not match version $version"; exit 1; }
              registries=true
            elif [ "$dry_run" != true ] && [ "$pypi" != testpypi ]; then
              echo "a real upload from a branch may only target TestPyPI; push a tag v$version"; exit 1
            fi
          fi
          # Dry runs exercise every publish job; real uploads to crates.io and
          # npm need a tag.
          [ "$dry_run" = true ] && registries=true
          {
            echo "dry_run=$dry_run"; echo "pypi=$pypi"; echo "registries=$registries"; echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, dry run $dry_run, Python index $pypi, crates.io/npm jobs $registries" >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: plan
    uses: ./.github/workflows/check.yml

  # ------------------------------------------------------------------ Python

  wheels:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: manylinux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, manylinux: "2_17" }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, manylinux: "2_17" }
          - { name: musllinux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, manylinux: musllinux_1_2 }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1.51.0
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          rust-toolchain: ${{ env.RUST_TOOLCHAIN }}
          args: --release --locked --out dist -m crates/fontpixel-py/Cargo.toml
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist -m crates/fontpixel-py/Cargo.toml
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # The suite runs from the repository's tests against the installed wheel
  # (tools/pytest_installed_package.py refuses the source tree).
  test-wheels:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: manylinux-x86_64, os: ubuntu-latest }
          - { name: manylinux-aarch64, os: ubuntu-24.04-arm }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-15 }
          - { name: windows-x64, os: windows-latest }
        python: ["3.10", "3.13"]
        include:
          # CPython for Windows on Arm starts at 3.11.
          - { platform: { name: windows-arm64, os: windows-11-arm }, python: "3.11" }
          - { platform: { name: windows-arm64, os: windows-11-arm }, python: "3.13" }
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    steps:
      - name: Keep LF line endings (byte-exact test data)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: pytest against the installed wheel
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          bin="$RUNNER_TEMP/venv/bin"; [ "$RUNNER_OS" = Windows ] && bin="$RUNNER_TEMP/venv/Scripts"
          "$bin/python" -m pip install --disable-pip-version-check pytest mypy
          "$bin/python" -m pip install --disable-pip-version-check --no-index --find-links dist fontpixel
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" "$bin/python" -m pytest \
            -p pytest_installed_package -p no:cacheprovider -q -rs "$GITHUB_WORKSPACE/crates/fontpixel-py/tests"

  # musl wheels are tested in the official Alpine Python images.
  test-wheels-musl:
    needs: wheels
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: musllinux-x86_64, os: ubuntu-latest }
          - { name: musllinux-aarch64, os: ubuntu-24.04-arm }
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist
      - name: pytest against the installed wheel (python:${{ matrix.python }}-alpine)
        run: |
          docker run --rm -v "$PWD:/repo:ro" -e PYTHONDONTWRITEBYTECODE=1 "python:${{ matrix.python }}-alpine" sh -euc '
            python -m venv /venv
            /venv/bin/pip install --disable-pip-version-check pytest
            /venv/bin/pip install --disable-pip-version-check --no-index --find-links /repo/dist fontpixel
            cd /tmp && PYTHONPATH=/repo/tools /venv/bin/python -m pytest \
              -p pytest_installed_package -p no:cacheprovider -q -rs /repo/crates/fontpixel-py/tests'

  test-sdist:
    needs: sdist
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: wheels-sdist
          path: dist
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Build from the sdist with pip, then pytest against it
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          export RUSTUP_TOOLCHAIN="$RUST_TOOLCHAIN"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check pytest
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check dist/fontpixel-*.tar.gz
          cd "$RUNNER_TEMP"
          PYTHONPATH="$GITHUB_WORKSPACE/tools" "$RUNNER_TEMP/venv/bin/python" -m pytest \
            -p pytest_installed_package -p no:cacheprovider -q -rs "$GITHUB_WORKSPACE/crates/fontpixel-py/tests"

  # --------------------------------------------------------------------- npm

  npm-build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Install wasm-pack and binaryen
        run: |
          cargo install wasm-pack --version "$WASM_PACK_VERSION" --locked
          curl -sSfL "https://github.com/WebAssembly/binaryen/releases/download/version_$BINARYEN_VERSION/binaryen-version_$BINARYEN_VERSION-x86_64-linux.tar.gz" | tar xz -C "$RUNNER_TEMP"
          echo "WASM_OPT=$RUNNER_TEMP/binaryen-version_$BINARYEN_VERSION/bin/wasm-opt" >> "$GITHUB_ENV"
      - name: Build the package and the reference CLI
        run: |
          scripts/build_npm.sh "$RUNNER_TEMP/npm"
          cargo build --locked --release -p fontpixel-cli --all-features
          mkdir -p "$RUNNER_TEMP/upload" && cp "$RUNNER_TEMP"/npm/fontpixel-*.tgz target/release/fontpixel "$RUNNER_TEMP/upload/"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/upload/
          if-no-files-found: error

  npm-test:
    needs: npm-build
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/pkg
      - name: Install the tarball and test it
        env:
          NPM_TEST_ALL_PROFILES: ${{ matrix.node == '24' && '1' || '0' }}
        run: |
          chmod +x "$RUNNER_TEMP/pkg/fontpixel"
          FONTPIXEL_CLI="$RUNNER_TEMP/pkg/fontpixel" scripts/test_npm_package.sh "$(ls "$RUNNER_TEMP"/pkg/fontpixel-*.tgz)" "$RUNNER_TEMP/npm-test"

  # ----------------------------------------------------------------- publish
  # Order: crates.io, then PyPI, then npm. Each publish job needs every test.

  publish-crates:
    needs: [plan, checks, test-wheels, test-wheels-musl, test-sdist, npm-test]
    if: needs.plan.outputs.registries == 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: cargo publish (fontpixel, fontpixel-ops, fontpixel-cli in dependency order)
        env:
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            cargo publish --locked --workspace --dry-run
          else
            cargo publish --locked --workspace
          fi

  publish-pypi:
    needs: [plan, checks, test-wheels, test-wheels-musl, test-sdist, npm-test, publish-crates]
    # After crates.io when that job ran; a TestPyPI run from a branch skips it.
    if: >-
      always() && needs.plan.result == 'success' && needs.checks.result == 'success' &&
      needs.test-wheels.result == 'success' && needs.test-wheels-musl.result == 'success' &&
      needs.test-sdist.result == 'success' && needs.npm-test.result == 'success' &&
      (needs.publish-crates.result == 'success' || needs.publish-crates.result == 'skipped')
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.pypi }}
    permissions:
      id-token: write # PyPI trusted publishing
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: List and check the distributions
        run: |
          ls -l dist
          python -m pip install --disable-pip-version-check twine
          python -m twine check --strict dist/*
      - name: Publish to TestPyPI
        if: needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.pypi == 'testpypi'
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Publish to PyPI
        if: needs.plan.outputs.dry_run != 'true' && needs.plan.outputs.pypi == 'pypi'
        uses: pypa/gh-action-pypi-publish@v1.14.2

  publish-npm:
    needs: [plan, publish-pypi]
    if: always() && needs.plan.outputs.registries == 'true' && needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm provenance
    timeout-minutes: 30
    steps:
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8.0.2
        with:
          name: npm-package
          path: pkg
      - name: npm publish
        env:
          DRY_RUN: ${{ needs.plan.outputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball="$(ls pkg/fontpixel-*.tgz)"
          if [ "$DRY_RUN" = true ]; then
            npm publish "$tarball" --access public --dry-run
          else
            npm publish "$tarball" --access public --provenance
          fi
