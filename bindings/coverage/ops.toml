# fontpixel-ops operations (fontpixel.ops) — unit p4
# Rule syntax: tools/bindings/check.py. Every request and option group is
# a flat plain-data dict (see fontpixel_ops crate docs); results are
# fontpixel.ops.OperationResult / BatchResult.

[[rule]]
pattern = "fontpixel_ops"
status = "bound"
python = "fontpixel.ops"
python_test = "crates/fontpixel-py/tests/test_ops.py::test_capabilities_constants_and_keys"

[[rule]]
pattern = "fontpixel_ops::capabilities"
status = "bound"
python = "fontpixel.ops.capabilities"
python_test = "crates/fontpixel-py/tests/test_ops.py::test_capabilities_constants_and_keys"
js = "capabilities() / requireCapability(name)"
js_test = "crates/fontpixel-wasm/tests/foundation.test.mjs::capabilities are explicit records"

[[rule]]
pattern = "fontpixel_ops::Capabilities"
status = "adapted"
python = "fontpixel.ops.capabilities() dict"
python_test = "crates/fontpixel-py/tests/test_ops.py::test_capabilities_constants_and_keys"
js = "capabilities() records {name, available, reason, evidence, alternative}"
js_test = "crates/fontpixel-wasm/tests/foundation.test.mjs::capabilities are explicit records"
reason = "plain dict {filesystem, threads, toml_batch}"

[[rule]]
pattern = "fontpixel_ops::Completed"
status = "adapted"
python = "fontpixel.ops.OperationResult (outputs, bundles, destinations)"
python_test = "crates/fontpixel-py/tests/test_ops.py::test_convert_memory_and_filesystem_equal_the_command_line"
reason = "response and prepared outputs carried by the result object"

