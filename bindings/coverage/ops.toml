# fontpixel-ops operations (fontpixel.ops) — unit p4
# Rule syntax: tools/bindings/check.py. Every request and option group is
# a flat plain-data dict (see fontpixel_ops crate docs); results are
# fontpixel.ops.OperationResult / BatchResult.

[[rule]]
pattern = "fontpixel_ops"
status = "bound"
python = "fontpixel.ops"
python_test = "crates/fontpixel-py/tests/test_ops.py::test_capabilities_constants_and_keys"
js = "ops namespace (ops.convert, ops.merge, …) plus info/merge/render"
js_test = "crates/fontpixel-wasm/tests/ops.test.mjs::capabilities defaults and keys"

[[rule]]
pattern = "fontpixel_ops::capabilities"
status = "bound"
python = "fontpixel.ops.capabilities"
python_test = "crates/fontpixel-py/tests/test_ops.py::test_capabilities_constants_and_keys"
js = "ops.capabilities() / capabilities() / requireCapability(name)"
js_test = "crates/fontpixel-wasm/tests/ops.test.mjs::capabilities defaults and keys"

[[rule]]
pattern = "fontpixel_ops::Capabilities"
status = "adapted"
python = "fontpixel.ops.capabilities() dict"
