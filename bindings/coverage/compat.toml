# bdfparser compatibility layer (fontpixel::compat) — unit p5
# Rule syntax: tools/bindings/check.py. Python API: fontpixel.compat.bdfparser
# (bdfparser 3.0 / SPEC-v3 names). Font/Glyph wrap the native handles
# fontpixel._native._bdfparser.RawFont / RawGlyph; Bitmap is the native class
# itself. The unmodified bdfparser test suite runs through
# crates/fontpixel-py/tests/compat_bdfparser/run_reference.py (see its
# KNOWN_DIFFERENCES.md).
#
# JS (phase 8): `fontpixel/compat/bdfparser` (bdfparser-js 3.0 names) over the
# wasm handles BdfparserRawFont / BdfparserRawGlyph / BdfparserRawBitmap
# (crates/fontpixel-wasm/src/compat*.rs, js/compat_bdfparser*.js). The unmodified
# bdfparser-js suite runs through
# crates/fontpixel-wasm/tests/compat_bdfparser/run_reference.mjs (see its
# KNOWN_DIFFERENCES.md).

[[rule]]
pattern = "fontpixel::compat"
status = "bound"
python = "fontpixel.compat"
python_test = "crates/fontpixel-py/tests/test_compat.py::test_module_surface"
js = "fontpixel/compat/bdfparser (package subpath; also /cjk, /cli)"
js_test = "crates/fontpixel-wasm/tests/compat.test.mjs::module surface"

[[rule]]
pattern = "fontpixel::compat::bdfparser"
status = "bound"
python = "fontpixel.compat.bdfparser"
python_test = "crates/fontpixel-py/tests/test_compat.py::test_module_surface"
js = "fontpixel/compat/bdfparser (package subpath; also /cjk, /cli)"
js_test = "crates/fontpixel-wasm/tests/compat.test.mjs::module surface"

