# The crate root itself: the Python package `fontpixel` re-exports the native API.
[[rule]]
pattern = "fontpixel"
status = "bound"
python = "fontpixel"
python_test = "crates/fontpixel-py/tests/test_package.py::test_package_exports"
js = "fontpixel (npm package entry point index.js; init/initSync)"
js_test = "crates/fontpixel-wasm/tests/root.test.mjs::package exports the native API"
