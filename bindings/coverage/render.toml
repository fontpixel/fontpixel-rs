# Rendering and image export (fontpixel::render) — unit p1
# Generated table; see tools/bindings/check.py for the rule syntax.

[[rule]]
pattern = "fontpixel::render"
status = "bound"
python = "fontpixel"
python_test = "crates/fontpixel-py/tests/test_render.py::test_default_advance_cell_ink_and_gaps"
js = "fontpixel (Font.draw*, Rendered, toPng, toSvg, ...)"
js_test = "crates/fontpixel-wasm/tests/render.test.mjs::default advance, cell, ink and gaps"

[[rule]]
pattern = "fontpixel::render::GlyphOrder"
status = "adapted"
python = "str ('ascending', 'descending', 'file', 'reverse_file')"
python_test = "crates/fontpixel-py/tests/test_render.py::test_draw_codepoints_and_draw_all"
js = "RenderGlyphOrder string ('ascending', 'descending', 'file', 'reverse_file')"
js_test = "crates/fontpixel-wasm/tests/render.test.mjs::draw codepoints and draw all"
reason = "plain data: the serde string/tagged form of the enum"

[[rule]]
pattern = "fontpixel::render::MissingGlyph"
status = "adapted"
python = "options['missing'] + missing_glyph=Glyph"
python_test = "crates/fontpixel-py/tests/test_render.py::test_directions_and_missing_are_explicit"
js = "options.missing + missingGlyph argument (Glyph | GlyphDict)"
js_test = "crates/fontpixel-wasm/tests/render.test.mjs::directions and missing glyphs are explicit"
reason = "'blank'/'error' through serde; the borrowed Glyph variant is the separate missing_glyph argument (see bindings-serde-exclusions.md)"

